<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script defer src="logic.js"></script>
  <script defer src="script.js"></script>
  <title>Etch-A-Sketch</title>
</head>
<body>
  <header>
    <h1>Etch-A-Sketch</h1>
    <nav class="tabs">
      <button id="tab-sketch" class="active">Sketch</button>
      <button id="tab-race">Paint Race</button>
    </nav>
  </header>

  <main>
    <section id="sketch-view">
      <div class="buttons">
        <input type="color" id="color-picker" value="#222222" title="Pick a color">
        <button data-mode="color" class="active">Color</button>
        <button data-mode="rainbow">Rainbow</button>
        <button data-mode="shade">Shade</button>
        <button data-mode="eraser">Eraser</button>
        <button id="clear">Clear</button>
      </div>

      <div class="frame">
        <div id="board" class="board"></div>
      </div>

      <div class="controls">
        <label for="slider">Size: <span id="size-label">16 x 16</span></label>
        <input type="range" id="slider" min="1" max="100" value="16">
        <label class="check"><input type="checkbox" id="lines" checked> Grid lines</label>
      </div>
    </section>

    <section id="race-view" hidden>
      <p class="rules">
        Move around the board to paint it your color. You can paint over the other player.
        The biggest connected patch wins: first to reach the goal, or the biggest when time runs out.
      </p>

      <div class="race-setup">
        <select id="race-mode">
          <option value="cpu">vs Computer</option>
          <option value="2p">2 Players</option>
        </select>
        <button id="race-start">Start</button>
      </div>

      <div class="scoreline">
        <span class="p1"><b id="name-0">Player 1</b>: <span id="score-0">0</span></span>
        <span id="race-timer">60</span>
        <span class="p2"><b id="name-1">Computer</b>: <span id="score-1">0</span></span>
      </div>

      <div class="frame">
        <div id="race-board" class="board"></div>
      </div>

      <p id="race-message" class="message">Player 1: W A S D or arrow keys.</p>
    </section>
  </main>
</body>
</html>
